name: Deploy Contract

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Install near-cli (JS)
        run: npm install -g near-cli

      - name: Build Contract
        run: |
          cd contract
          cargo build --release --target wasm32-unknown-unknown
          cd ..

      - name: Create Credentials
        run: |
          mkdir -p ~/.near-credentials/testnet
          echo '{"account_id": "hearthold-escrow.testnet", "private_key": "${{ secrets.NEAR_PRIVATE_KEY }}"}' > ~/.near-credentials/testnet/hearthold-escrow.testnet.json

      - name: Delete and Recreate Contract Account
        run: |
          echo "Deleting existing contract account to clear corrupted state..."
          near delete hearthold-escrow.testnet jayisagod.testnet --force --networkId testnet || true
          echo "Recreating contract account..."
          near create-account hearthold-escrow.testnet --masterAccount jayisagod.testnet --initialBalance 5 --networkId testnet

      - name: Deploy to Testnet
        run: |
          near deploy hearthold-escrow.testnet ./contract/target/wasm32-unknown-unknown/release/hearthold_contract.wasm \
            --initFunction new \
            --initArgs '{"allowed_token": "ft.hearthold-jay.testnet", "arbitrator": "hearthold-arbitrator.testnet"}' \
            --initGas 100000000000000 \
            --initDeposit 0 \
            --networkId testnet
